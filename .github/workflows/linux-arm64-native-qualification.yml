name: Linux ARM64 native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-arm64-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    # Register a clean Ubuntu 24.04 aarch64 runner with this additional label.
    # Current Qt ARM64 wheels require glibc 2.39 and the supported libwebp ABI.
    runs-on: [self-hosted, Linux, ARM64, sift-ubuntu-24-04-arm64]
    timeout-minutes: 180
    steps:
      - name: Verify the native target
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.39"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12.11"

      - name: Install the pinned Rust build toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install native desktop qualification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream bubblewrap build-essential dbus-x11 desktop-file-utils \
            gnome-keyring libasound2t64 libdbus-1-3 libegl1 \
            libevent-2.1-7t64 libexpat1 libffi-dev libfontconfig1 \
            libfreetype6 libgbm1 libgl1 libminizip1t64 libnspr4 libnss3 \
            libopus0 libpulse0 libsnappy1v5 libssl-dev libtbb12 libudev1 \
            libwebp7 libwebpdemux2 libwebpmux3 libx11-6 libx11-xcb1 \
            libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 \
            libxi6 libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxrandr2 libxshmfence1 libxss1 libxtst6 libxcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 pkg-config python3-dev \
            unixodbc xvfb zlib1g

      - name: Prepare Ubuntu confinement policy
        run: sudo bash packaging/linux/prepare_ubuntu_host.sh

      - name: Install pinned scientific reference environment
        run: sudo bash packaging/install_linux_qualification_r.sh

      - name: Build and execute the complete ARM64 Linux qualification
        shell: bash
        run: bash packaging/build_linux.sh

      - name: Require the architecture-specific artifact
        shell: bash
        run: test -s dist/Sift-Linux-aarch64.tar.gz

      - name: Retain qualified ARM64 artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sift-linux-aarch64-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: dist/Sift-Linux-aarch64.tar.gz*
