name: Temporary Linux artifact diagnosis

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install declared desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2t64 libdbus-1-3 libegl1 libevent-2.1-7t64 libexpat1 \
            libfontconfig1 libfreetype6 libgbm1 libgl1 libminizip1t64 \
            libnspr4 libnss3 libopus0 libpulse0 libsnappy1v5 libtbb12 \
            libudev1 libwebp7 libwebpdemux2 libwebpmux3 libx11-6 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxrandr2 libxshmfence1 libxss1 libxtst6 libxcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 zlib1g

      - name: Download run 20 Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sift-linux-33114835729
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: JeevanSandhu13/sift-github-review
          run-id: 33114835729

      - name: Report exact frozen Qt loader failures
        shell: bash
        run: |
          set -u
          mkdir extracted
          tar -xzf dist/Sift-Linux-x86_64.tar.gz -C extracted
          root="extracted/Sift/app/_internal/PyQt6"
          for target in \
            "$root/QtCore.abi3.so" \
            "$root/QtWidgets.abi3.so" \
            "$root/QtWebEngineWidgets.abi3.so" \
            "$root/Qt6/lib/libQt6Core.so.6" \
            "$root/Qt6/lib/libQt6Gui.so.6" \
            "$root/Qt6/lib/libQt6WebEngineCore.so.6"; do
            echo "=== $target ==="
            missing="$(ldd "$target" | grep 'not found' || true)"
            if [[ -n "$missing" ]]; then
              printf '%s\n' "$missing"
            else
              echo "all direct libraries resolved"
            fi
          done
          echo "=== frozen platform check ==="
          LD_DEBUG=libs extracted/Sift/app/sift --platform-check \
            >platform-report.json 2>loader-debug.log || true
          cat platform-report.json
          echo "=== fatal loader lines ==="
          grep -E 'not found|undefined symbol|error|cannot open' \
            loader-debug.log || true
          echo "=== loader tail ==="
          tail -n 120 loader-debug.log
