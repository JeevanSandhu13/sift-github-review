name: Temporary Linux artifact diagnosis

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install declared desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libasound2t64 libdbus-1-3 libegl1 libevent-2.1-7t64 libexpat1 \
            libfontconfig1 libfreetype6 libgbm1 libgl1 libminizip1t64 \
            libnspr4 libnss3 libopus0 libpulse0 libsnappy1v5 libtbb12 \
            libudev1 libwebp7 libwebpdemux2 libwebpmux3 libx11-6 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxrandr2 libxshmfence1 libxss1 libxtst6 libxcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 zlib1g

      - name: Download qualified Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sift-linux-33114835729
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: JeevanSandhu13/sift-github-review
          run-id: 33114835729

      - name: Report exact frozen Qt import failure
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          tar -xzf dist/Sift-Linux-x86_64.tar.gz -C extracted
          internal="$PWD/extracted/Sift/app/_internal"
          LD_LIBRARY_PATH="$internal:$internal/PyQt6/Qt6/lib" \
          SIFT_FROZEN_INTERNAL="$internal" python3 -I <<'PY'
          import importlib
          import os
          import sys
          import traceback

          sys.path.insert(0, os.environ["SIFT_FROZEN_INTERNAL"])
          for name in ("PyQt6", "PyQt6.QtCore", "PyQt6.QtWidgets", "PyQt6.QtWebEngineCore", "PyQt6.QtWebEngineWidgets"):
              print(f"=== import {name} ===", flush=True)
              try:
                  module = importlib.import_module(name)
              except BaseException:
                  traceback.print_exc()
              else:
                  print(f"loaded {getattr(module, '__file__', '<namespace>')}", flush=True)
          PY
