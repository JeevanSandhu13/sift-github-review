name: Temporary Ubuntu 24.04 artifact diagnosis

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out qualification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install declared desktop runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            appstream bubblewrap dbus-x11 desktop-file-utils gnome-keyring \
            libasound2t64 libdbus-1-3 libegl1 libevent-2.1-7t64 libexpat1 \
            libfontconfig1 libfreetype6 libgbm1 libgl1 libminizip1t64 \
            libnspr4 libnss3 libopus0 libpulse0 libsnappy1v5 libtbb12 \
            libudev1 libwebp7 libwebpdemux2 libwebpmux3 libx11-6 \
            libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 \
            libxfixes3 libxi6 libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 \
            libxrandr2 libxshmfence1 libxss1 libxtst6 libxcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 unixodbc xvfb zlib1g

      - name: Prepare Ubuntu confinement policy
        run: sudo bash packaging/linux/prepare_ubuntu_host.sh

      - name: Download the qualified Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sift-linux-33121670217
          path: dist
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: JeevanSandhu13/sift-github-review
          run-id: 33121670217

      - name: Qualify and expose the exact native import failure
        shell: bash
        env:
          SIFT_PLATFORM_IMPORT_DIAGNOSTICS: "1"
        run: bash packaging/qualify_linux_install.sh dist/Sift-Linux-x86_64.tar.gz
