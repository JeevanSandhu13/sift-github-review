name: Diagnose Ubuntu 24 renderer policy

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/linux-artifact-diagnose.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install runtime and policy tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            apparmor apparmor-profiles apparmor-utils appstream bubblewrap \
            dbus-x11 desktop-file-utils gnome-keyring libasound2t64 \
            libdbus-1-3 libegl1 libevent-2.1-7t64 libexpat1 libfontconfig1 \
            libfreetype6 libgbm1 libgl1 libminizip1t64 libnspr4 libnss3 \
            libopus0 libpulse0 libsnappy1v5 libtbb12 libudev1 libwebp7 \
            libwebpdemux2 libwebpmux3 libx11-6 libx11-xcb1 libxcomposite1 \
            libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 \
            libxkbcommon0 libxkbcommon-x11-0 libxkbfile1 libwayland-server0 \
            libxrandr2 libxshmfence1 libxss1 libxtst6 libxcb1 \
            libxcb-cursor0 libxcb-dri3-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render0 \
            libxcb-render-util0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xkb1 strace unixodbc xvfb zlib1g

      - name: Download run 27 Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 33132646584
          name: sift-linux-33132646584
          path: dist

      - name: Load Sift policies and inspect renderer path
        env:
          SIFT_LINUX_QUALIFICATION_ROOT: ${{ runner.temp }}/sift-linux-install-qualification
        run: |
          sudo --preserve-env=SIFT_LINUX_QUALIFICATION_ROOT \
            bash packaging/linux/prepare_ubuntu_host.sh
          tar -tzf dist/Sift-Linux-x86_64.tar.gz | grep -F QtWebEngineProcess
          sudo apparmor_status

      - name: Reproduce renderer failure with kernel diagnostics
        env:
          SIFT_LINUX_QUALIFICATION_ROOT: ${{ runner.temp }}/sift-linux-install-qualification
          SIFT_PLATFORM_IMPORT_DIAGNOSTICS: "1"
          QT_LOGGING_RULES: "qt.webenginecontext.debug=true"
        run: |
          TEST_ROOT="$SIFT_LINUX_QUALIFICATION_ROOT"
          BUNDLE_ROOT="$TEST_ROOT/bundle"
          USER_HOME="$TEST_ROOT/home with spaces % dollar\$ tick\`"
          DATA_HOME="$USER_HOME/.local/share"
          BIN_HOME="$USER_HOME/.local/bin"
          mkdir -m 0700 -p "$BUNDLE_ROOT" "$USER_HOME"
          tar -xzf dist/Sift-Linux-x86_64.tar.gz -C "$BUNDLE_ROOT"
          HOME="$USER_HOME" XDG_DATA_HOME="$DATA_HOME" XDG_BIN_HOME="$BIN_HOME" \
            "$BUNDLE_ROOT/Sift/install.sh"
          find "$DATA_HOME/sift/app" -name QtWebEngineProcess -type f -print

          set +e
          HOME="$USER_HOME" QTWEBENGINE_CHROMIUM_FLAGS="--enable-logging=stderr --v=1" \
            xvfb-run -a "$BIN_HOME/sift" --renderer-check 2>&1 \
            | tee "$RUNNER_TEMP/sift-renderer.log"
          status=${PIPESTATUS[0]}
          sudo journalctl --dmesg --since "-10 minutes" --no-pager \
            | grep -Ei 'apparmor|denied|userns|qtwebengine|sift-linux-install' \
            | tail -200 || true
          if [[ "$status" -ne 0 ]]; then
            HOME="$USER_HOME" xvfb-run -a strace -ff -s 256 \
              -o "$RUNNER_TEMP/sift-renderer.trace" \
              "$BIN_HOME/sift" --renderer-check || true
            grep -HE 'SIGABRT|SIGTRAP|EPERM|EACCES|clone3?\(' \
              "$RUNNER_TEMP"/sift-renderer.trace* | tail -300 || true
          fi
          exit "$status"
